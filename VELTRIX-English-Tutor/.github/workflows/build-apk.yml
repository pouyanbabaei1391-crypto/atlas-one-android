name: VELTRIX English Tutor APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths-ignore: ['**.md']
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - name: Checkout VELTRIX source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android platform, NDK and CMake with runner SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          sdkmgr="$sdk/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmgr" || sdkmgr=$(find "$sdk/cmdline-tools" -name sdkmanager -type f | head -n1)
          test -x "$sdkmgr" || { echo 'ERROR: SDK Manager missing'; exit 1; }
          set +e
          yes | "$sdkmgr" --sdk_root="$sdk" --licenses
          rc=${PIPESTATUS[1]}
          set -e
          test "$rc" -eq 0
          "$sdkmgr" --sdk_root="$sdk" --install 'platforms;android-36' 'build-tools;36.0.0' 'ndk;29.0.13113456' 'cmake;3.31.6'
      - name: Fetch official llama.cpp Android inference library
        run: bash scripts/bootstrap_llama.sh
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Verify source/UI integration
        run: node tests/source_smoke.js && node --check app/src/main/assets/tutor.js
      - name: Build APK (ARM64)
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: VELTRIX-English-Tutor-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
