name: Build Atlas Android APK
on:
  workflow_dispatch:
    inputs:
      bundle_model:
        description: Include Gemma 3 4B weights in APK (about 2.49 GB)
        type: boolean
        default: true
  push:
    branches: [main, master]
permissions:
  contents: read
concurrency:
  group: atlas-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test and build local Gemma edition
        env:
          ATLAS_BUNDLE_MODEL: ${{ github.event_name != 'workflow_dispatch' || inputs.bundle_model }}
        run: python english_voice_addon/build.py android
      - name: Upload Android installer
        uses: actions/upload-artifact@v4
        with:
          name: Atlas-One-Android-APK
          path: dist/Atlas-One-Android.apk
          if-no-files-found: error
          compression-level: 0

