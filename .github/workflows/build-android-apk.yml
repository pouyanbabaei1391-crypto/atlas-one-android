name: Build Atlas Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Flutter diagnostics
        run: |
          flutter --version
          dart --version
          flutter doctor -v

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Build Atlas APK
        run: python3 build.py android

      - name: Verify APK
        run: |
          test -f dist/Atlas-One-Android.apk
          ls -lh dist/Atlas-One-Android.apk
          sha256sum dist/Atlas-One-Android.apk | tee dist/Atlas-One-Android.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Atlas-One-Android-APK
          path: |
            dist/Atlas-One-Android.apk
            dist/Atlas-One-Android.apk.sha256
          if-no-files-found: error
          retention-days: 30
