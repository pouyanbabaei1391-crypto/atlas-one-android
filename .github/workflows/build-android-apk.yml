name: Build Atlas Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: atlas-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      CI: "true"
      JAVA_TOOL_OPTIONS: "-Xmx4g"
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - name: Verify toolchain
        run: |
          flutter --version
          dart --version
          java -version
          python3 --version

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail
          python3 build.py android
          test -s dist/Atlas-One-Android.apk
          ls -lh dist/Atlas-One-Android.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Atlas-One-Android-APK
          path: dist/Atlas-One-Android.apk
          if-no-files-found: error
          retention-days: 14
