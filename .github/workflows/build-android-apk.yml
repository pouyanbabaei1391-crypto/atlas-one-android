name: Build Atlas Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - "download/**"

permissions:
  contents: write

concurrency:
  group: atlas-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      CI: "true"
      JAVA_TOOL_OPTIONS: "-Xmx4g"
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter 3.47.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: false

      - name: Diagnostics
        shell: bash
        run: |
          set -euxo pipefail
          java -version
          flutter --version
          dart --version
          flutter config --no-analytics
          flutter doctor -v || true

      - name: Build release APK
        shell: bash
        run: |
          set -euxo pipefail
          python3 -u build.py android

      - name: Verify APK
        shell: bash
        run: |
          set -euxo pipefail
          test -s dist/Atlas-One-Android.apk
          ls -lh dist/Atlas-One-Android.apk
          sha256sum dist/Atlas-One-Android.apk | tee dist/Atlas-One-Android.apk.sha256

      - name: Publish APK to repository
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p download
          cp dist/Atlas-One-Android.apk download/Atlas-One-Android.apk
          cp dist/Atlas-One-Android.apk.sha256 download/Atlas-One-Android.apk.sha256
          git config user.name "Atlas Build Bot"
          git config user.email "atlas-build-bot@users.noreply.github.com"
          git add -f download/Atlas-One-Android.apk
          git add -f download/Atlas-One-Android.apk.sha256
          if ! git diff --cached --quiet; then
            git commit -m "Update Atlas Android APK [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Upload installable Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Atlas-One-Android-APK
          path: |
            dist/Atlas-One-Android.apk
            dist/Atlas-One-Android.apk.sha256
          if-no-files-found: error
          retention-days: 30
