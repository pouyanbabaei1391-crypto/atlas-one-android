name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout existing repository
        uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Validate Dart lesson parser and URL handling
        run: |
          flutter pub get
          flutter test test/language/lesson_turn_test.dart
      - name: Build Android release APK using existing build system
        run: python3 build.py android
      - name: Preserve original APK name and create VELTRIX alias
        run: cp dist/Atlas-One-Android.apk dist/VELTRIX-AI-English-Mastery.apk
      - name: Publish existing Atlas APK artifact name
        uses: actions/upload-artifact@v4
        with:
          name: Atlas-One-Android-APK
          path: dist/Atlas-One-Android.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish VELTRIX AI APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VELTRIX-AI-English-Mastery-APK
          path: dist/VELTRIX-AI-English-Mastery.apk
          if-no-files-found: error
          retention-days: 30
