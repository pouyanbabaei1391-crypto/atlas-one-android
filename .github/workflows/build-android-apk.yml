name: Build Atlas Android Autonomous APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-android-autonomous-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Analyze, test, and build Slim autonomous edition
        env:
          ATLAS_BUNDLE_MODEL: 'false'
        run: python3 english_voice_addon/build.py android

      - name: Enforce Slim installer ceiling
        run: python3 english_voice_addon/verify_slim_apk.py dist/Atlas-One-Android.apk --max-bytes 800000000

      - name: Upload verified APK
        uses: actions/upload-artifact@v5
        with:
          name: Atlas-One-Android-AUTONOMOUS-MEMORY-CAMERA-APK
          path: dist/Atlas-One-Android.apk
          if-no-files-found: error
          compression-level: 0
