name: Build Atlas Android Slim APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-slim-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-slim-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ATLAS_BUNDLE_MODEL: "false"
    steps:
      - name: Checkout Atlas
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build local Gemma Slim APK
        shell: bash
        run: python3 english_voice_addon/build.py android

      - name: Enforce Slim installer limit
        shell: bash
        run: python3 english_voice_addon/verify_slim_apk.py dist/Atlas-One-Android.apk --max-bytes 800000000

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Atlas-One-Android-Slim-Local-Gemma
          path: dist/Atlas-One-Android.apk
          if-no-files-found: error
          retention-days: 14
