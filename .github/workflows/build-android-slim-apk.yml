name: Build Atlas Android Slim APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: atlas-android-slim-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-slim-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test and build slim local Gemma edition
        env:
          ATLAS_BUNDLE_MODEL: 'false'
        run: python english_voice_addon/build.py android
      - name: Enforce the 800 MB installer ceiling
        run: python english_voice_addon/verify_slim_apk.py dist/Atlas-One-Android.apk --max-bytes 800000000
      - name: Upload verified slim Android installer
        uses: actions/upload-artifact@v4
        with:
          name: Atlas-One-Android-SLIM-APK
          path: dist/Atlas-One-Android.apk
          if-no-files-found: error
          compression-level: 0

