name: Build Atlas Android Hybrid APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-android-hybrid-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-hybrid-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Require the secure Hybrid gateway URL
        env:
          ATLAS_HYBRID_GATEWAY_URL: ${{ secrets.ATLAS_HYBRID_GATEWAY_URL }}
        run: test -n "$ATLAS_HYBRID_GATEWAY_URL"
      - name: Test and build Hybrid local/cloud edition
        env:
          ATLAS_BUNDLE_MODEL: 'false'
          ATLAS_HYBRID_GATEWAY_URL: ${{ secrets.ATLAS_HYBRID_GATEWAY_URL }}
          ATLAS_HYBRID_CLOUD_MODEL: llama-3.1-8b-instant
        run: python hybrid_voice_addon/build.py android
      - name: Enforce the 800 MB installer ceiling
        run: python english_voice_addon/verify_slim_apk.py dist/Atlas-One-Android.apk --max-bytes 800000000
      - name: Upload verified Hybrid Android installer
        uses: actions/upload-artifact@v4
        with:
          name: Atlas-One-Android-HYBRID-APK
          path: dist/Atlas-One-Android.apk
          if-no-files-found: error
          compression-level: 0

