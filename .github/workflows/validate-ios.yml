name: Validate Atlas iOS
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-ios:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 english_voice_addon/build.py ios-unsigned
      - uses: actions/upload-artifact@v4
        with:
          name: Atlas-One-iOS-UNSIGNED
          path: dist/Atlas-One-iOS-UNSIGNED.zip
          if-no-files-found: error
