name: Validate Atlas iOS
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-ios:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      - run: python3 build.py ios-unsigned
      - uses: actions/upload-artifact@v4
        with:
          name: Atlas-iOS-UNSIGNED
          path: dist/Atlas-One-iOS-UNSIGNED.zip
          if-no-files-found: error
